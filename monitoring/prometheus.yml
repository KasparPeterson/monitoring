# my global config
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "app"

rule_files:

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: [ "localhost:9090" ]

  - job_name: "tinytitan-node-exporter"
    scrape_interval: 15s
    metrics_path: "/metrics"
    static_configs:
      - targets: [ "node_exporter:9100" ]

  - job_name: "bigtitan-node-exporter"
    scrape_interval: 15s
    metrics_path: "/metrics"
    static_configs:
      - targets: [ "192.168.1.117:9100" ]

  - job_name: "execution-client"
    scrape_interval: 15s
    metrics_path: "/debug/metrics/prometheus"
    static_configs:
      - targets: [ "192.168.1.117:6060" ]
        labels:
          chain: goerli

  - job_name: "beacon-node"
    static_configs:
      - targets: [ '192.168.1.117:8080' ]
