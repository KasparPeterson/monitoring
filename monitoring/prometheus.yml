# my global config
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "app"

rule_files:

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: [ "localhost:9090" ]

  - job_name: "node-exporters"
    scrape_interval: 15s
    metrics_path: "/metrics"
    static_configs:
      - targets: [ "node_exporter:9100" ]
